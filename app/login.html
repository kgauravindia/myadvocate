<!doctype html>
<html lang="en">
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<div id='apparea'>
	<div id='loader'></div>
<nav class="navbar fixed-top navbar-expand-lg navbar-light text-light" id ='apphead'>
	<h5 id='apptitle' class='col-8'><img src='img/logo.png' height='30px' align='left'></h5>
	<div id='appmenu'>
		<a href='https://facebook.com/MyAdvIndia'><img src='img/facebook.png' height='25px' align='right' class='m-1' > </a> 
		<a href='https://twitter.com/MyAdvIndia'><img src='img/twitter.png' height='25px' align='right' class='m-1' onclick="applaunch('com.twitter.android')"> </a>
		<a href='https://instagram.com/MyAdvIndia'><img src='img/instagram.png' height='25px' align='right' class='m-1' onclick="applaunch('com.instagram.android')"> </a>
	</div>
</nav> <!-- Header End -->
<div class="container-fluid " id='appbody'>
	<div class="jumbotron">
		<center>
		  <h5>Login to Get More</h5>
		  <p>Examination, Notification etc. </p>
		</center>
	</div>
	<div id='register_area' style='display:none' >
		<form id='insert_frm' method='post'>
				
			<select id="user_type" name="user_type" class='form-control mb-2' required onchange="toggleAdvocateFields()">
				<option value="">Select User Type</option>
				<option value="advocate">Advocate</option>
				<option value="member">Member</option>
			</select>
			<div id="advocate_fields" style="display: none;">
				<select name="bc_id" class="form-control mb-2" id="bc_id">
					<option value="">Bar Council *</option>
				</select>
				<input type="text" name="e_no" class="form-control mb-2" id="e_no" placeholder="Enter Enrollment No. *">
				<input type="number" name="e_year" class="form-control mb-2" id="e_year" max="2026" min="1950" placeholder="Year of Enrollment *">
			</div>
			<input type='text' placeholder='Full Name *' class='form-control mb-2' required name='name'>
			<input type='tel' placeholder='Mobile No. *' class='form-control mb-2' required name='mobile' pattern="[0-9]{10}" maxlength='10' minlength='10' oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);">
			<input type='email' placeholder='Email Id' class='form-control mb-2' name='email'>
			<input type='tel' placeholder='Pincode' class='form-control mb-2' name='pincode' maxlength='6' minlength='6' required>
			<p> I have gone through <b id='terms' >Terms and Conditions </b> and <b id='privacy'> Privacy Policy  </b> </p>
			<button class='btn btn-danger btn-block mb-4' id='signup_btn' > Register Me</button>
		</form>
				<button class='btn btn-border text-sucess btn-block text-sm' id='login' > Already have account  <b> Login </b> </button>
	</div>
	<div id='login_area' >
		<form id='login_frm' method='post'>
			<input type='tel' placeholder='Mobile *' class='form-control mb-2' required name='user_name' pattern="[0-9]{10}" maxlength='10' minlength='10' oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);">
			<input type='Password' placeholder='Password *' class='form-control mb-2' name='user_pass' maxlength='25' required>
			<p> I have gone through <b id='terms' >Terms and Conditions </b> and <b id='privacy'> Privacy Policy  </b> </p>
			<button class='btn btn-danger btn-block mb-4' id='login_btn' > Secure Login </button>
		</form>
			<button class='btn btn-border text-sucess btn-block text-sm' id='recover' > Forget password <b> Recover</b> </button>
			<button class='btn btn-border text-sucess btn-block text-sm' id='signup' > Don't have account <b> Sign Up</b> </button>
	</div>
	<div id='recover_area' style ='display:none' >
		<form id='recover_frm' method='post'>
			<input type='tel' placeholder='Mobile *' class='form-control mb-2' name='mobile' pattern="[0-9]{10}" maxlength='10' minlength='10' required oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);">
			<button class='btn btn-danger btn-block mb-4' id='recover_btn' >Recover Password </button>
		</form>
			<button class='btn btn-border text-sucess btn-block text-sm' id='login1' > I have account <b> Sign In</b> </button>
			<button class='btn btn-border text-sucess btn-block text-sm' id='signup1' > Don't have account <b> Sign Up</b> </button>
	</div>
<nav class="navbar fixed-bottom navbar-expand-lg navbar-light " id='appfoot'>
		<a href='index.html'><img src='img/home.png' id='home' data-id='1' align='left' height='25px'></a>
		<!--<img src='img/search.png' id='search_advocate'  align='left' height='25px'>-->
		<img src='img/share.png' id='qprev' onclick='shot()' align='left' height='25px'>
</nav>
</div>
</div>
<!--<script src="cordova.js"></script> -->
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/popper.min.js"></script>
<script src="js/jquery.validate.min.js"></script>
<!--<script src="js/index.js"></script>  -->
<script src="js/app.js"></script>  
<script>
	$("#signup,#signup1").on('click',function(){
		$("#register_area").css("display","block");
		$("#login_area").css("display","none");
		$("#recover_area").css("display","none");
	});
	
	function toggleAdvocateFields() {
		var userType = $("#user_type").val();
		if (userType === 'advocate') {
			$("#advocate_fields").css("display", "block");
			$("#bc_id").attr("required", "required");
			$("#e_no").attr("required", "required");
			$("#e_year").attr("required", "required");
			
			// Load Bar Council list if empty
			if ($("#bc_id option").length <= 1) {
				$.ajax({
					type: 'POST',
					url: base_url + 'task=bc_list',
					success: function(data) {
						$("#bc_id").html('<option value="">Bar Council *</option>' + data);
					}
				});
			}
		} else {
			$("#advocate_fields").css("display", "none");
			$("#bc_id").removeAttr("required").val('');
			$("#e_no").removeAttr("required").val('');
			$("#e_year").removeAttr("required").val('');
		}
	}
	$("#recover").on('click',function(){
		$("#register_area").css("display","none");
		$("#login_area").css("display","none");
		$("#recover_area").css("display","block");
	});
	
	$("#login,#login1").on('click',function(){
		$("#register_area").css("display","none");
		$("#recover_area").css("display","none");
		$("#login_area").css("display","block");
	});
	if (localStorage.getItem('myadv_id') !=null)
	{
		window.location='main.html';
	}
</script>
</body>
</html>
